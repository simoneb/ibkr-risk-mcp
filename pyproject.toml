[build-system]
# 77 or newer for PEP 639 licence metadata (the `license` SPDX expression and
# `license-files`), which older setuptools ignores or rejects.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-risk-mcp"
version = "0.3.0"
description = "MCP server exposing Interactive Brokers portfolio risk: model greeks, IB's volatility surface, what-if margin, and a local stress engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Simone Busoli" }
]
keywords = ["mcp", "ibkr", "interactive-brokers", "tws", "risk", "options", "greeks", "stress-test"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=1.10.0,<2.0",
  # The HTTP transport and its bearer-token boundary. Shared with the other
  # servers rather than copied into each, because a security boundary that
  # exists twice gets fixed once.
  "mcp-remote-auth @ git+https://github.com/simoneb/mcp-remote-auth@v0.1.1",
  "ib-async>=1.0.3,<3.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# httpx and pyjwt arrive with mcp-remote-auth for the server itself; they are
# listed here because scripts/http_smoke.py imports them directly.
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<2.0", "httpx>=0.27", "pyjwt[crypto]>=2.8,<3.0"]

[project.scripts]
ibkr-risk-mcp = "ibkr_risk_mcp.server:main"

# Local development against the shared package. This is a uv-only override: it
# does not appear in the published metadata, so the dependency above stays a
# proper pin while edits here are visible immediately in both servers.
[tool.uv.sources]
mcp-remote-auth = { path = "../mcp-remote-auth", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
